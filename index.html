<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f"><title>RogueGame</title><link rel="stylesheet" href="/style.css"></head><body><main id="app"><canvas id="game"></canvas><div id="joystick"><div id="stick"></div></div><button id="speed" class="speed-btn" type="button" onclick="window.toggleSpeed()">速度 ×1</button><section id="hud"><div class="top"><span>HP <b id="hp">100/100</b></span><span>LV <b id="level">1</b></span><span>金币 <b id="gold">0</b></span><span>时间 <b id="time">0:00</b></span></div><div class="bar"><i id="hpbar"></i></div><div class="bar xp"><i id="xpbar"></i></div><div id="weapon"></div><div id="bossbar" class="bar boss hidden"><i id="bossfill"></i></div></section><section id="menu" class="panel"><h1>ROGUE GAME</h1><p>轻量网页 Roguelite · 无需登录 · 云存档</p><button id="start" type="button" onclick="window.__rgStart()">开始游戏</button><button id="meta" type="button" class="secondary">永久成长</button><button id="continue" type="button" class="secondary" onclick="window.__rgLoad()">读取云存档</button><small>电脑：WASD 移动 · 自动瞄准<br>手机：左下摇杆移动 · 自动瞄准</small><div id="version">v1.3.2</div></section><section id="metaPanel" class="panel hidden"><h2>永久成长</h2><p>永久金币：<b id="metaGold">0</b></p><div id="metaChoices"></div><button id="metaClose" type="button" class="secondary">返回</button></section><section id="levelup" class="panel hidden"><h2>升级</h2><p>选择一项强化</p><div id="choices"></div></section><section id="result" class="panel hidden"><h2 id="resultTitle">你倒下了</h2><p id="resultText"></p><button id="again" type="button" onclick="window.__rgStart()">再来一局</button><button id="save" type="button" class="secondary" onclick="window.__rgSave()">保存进度</button><button id="resultHome" type="button" class="secondary" onclick="window.goHome()">返回首页 / 永久成长</button></section><section id="victory" class="panel hidden"><h2>通关</h2><p id="victoryText"></p><button id="victoryAgain" type="button" onclick="window.__rgStart()">再次挑战</button><button id="victoryHome" type="button" class="secondary" onclick="window.goHome()">返回首页 / 永久成长</button></section><div id="toast"></div></main><script src="/game.js?v=44" defer></script><script>
window.__rgStart=function(){
  if(typeof window.start==='function') return window.start();
  var v=document.getElementById('version'); if(v)v.textContent='v1.1.8 · 游戏脚本未加载';
};
window.__rgLoad=function(){
  if(typeof window.loadCloud==='function') return window.loadCloud();
  var v=document.getElementById('version'); if(v)v.textContent='v1.1.8 · 游戏脚本未加载';
};
window.__rgSave=function(){
  if(typeof window.saveCloud==='function') return window.saveCloud(true);
  var v=document.getElementById('version'); if(v)v.textContent='v1.1.8 · 游戏脚本未加载';
};
window.addEventListener('error',function(e){
  if(e.filename && e.filename.indexOf('/game.js')!==-1){
    var v=document.getElementById('version'); if(v)v.textContent='v1.1.8 · JS错误：'+(e.message||'加载失败');
  }
});
</script></body></html>
