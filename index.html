<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d16"><title>蛇之进化 · Snake Survivors</title><style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#090d16;color:#eef3ff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.hidden{display:none!important}.panel{position:fixed;inset:0;margin:auto;width:min(92vw,480px);height:max-content;max-height:90vh;overflow:auto;background:#111a2af2;border:1px solid #34435d;border-radius:20px;padding:25px;text-align:center;z-index:20;box-shadow:0 20px 70px #000b}.panel h1{font-size:42px;margin:5px}.panel p{color:#aebbd0}.panel button{display:block;width:100%;border:0;border-radius:11px;padding:13px;margin:10px 0;background:#5e83ed;color:white;font-size:16px}.secondary{background:#29354a!important}.choice{background:#1b2940;border:1px solid #3a4d6d;border-radius:12px;padding:14px;margin:9px 0;text-align:left}.choice strong,.choice span{display:block}.choice span{font-size:13px;color:#aab8ce;margin-top:4px}#hud{position:absolute;z-index:4;left:12px;top:10px;right:90px;pointer-events:none;text-shadow:0 1px 3px #000}.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.bar{height:7px;max-width:360px;background:#293348;border-radius:8px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#f05d78}.xp i{background:#5ba7ff!important}#build{font-size:11px;color:#aab8ce;margin-top:6px}#speed{position:absolute;z-index:6;right:12px;top:12px;padding:10px 13px;background:#172337;color:white;border:1px solid #45536a;border-radius:11px}#joystick{position:absolute;z-index:8;left:24px;bottom:32px;width:128px;height:128px;border:2px solid #ffffff35;background:#ffffff0b;border-radius:50%;touch-action:none}#stick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#a9c8ff55;border:2px solid #d5e4ff88;pointer-events:none}#toast{position:absolute;z-index:12;left:50%;top:22%;transform:translateX(-50%);background:#111b2ddd;border:1px solid #465875;padding:9px 15px;border-radius:20px;opacity:0;pointer-events:none;font-size:13px}@media(min-width:700px){#joystick{display:none!important}#hud{left:20px;top:18px}.stats{font-size:15px}}
</style></head><body><main id="app"><canvas id="game"></canvas>
<header id="hud" class="hidden"><div class="stats"><span>生命 <b id="hp">100/100</b></span><span>等级 <b id="level">1</b></span><span>长度 <b id="length">4</b></span><span>时间 <b id="time">0:00</b></span><span>金币 <b id="gold">0</b></span></div><div class="bar"><i id="hpbar"></i></div><div class="bar xp"><i id="xpbar"></i></div><div id="build"></div></header><button id="speed" class="hidden">速度 ×1</button><div id="joystick" class="hidden"><div id="stick"></div></div>
<section id="menu" class="panel"><div style="color:#76d7c4;letter-spacing:4px;font-size:12px">SNAKE SURVIVORS</div><h1>蛇之进化</h1><p>吞噬成长，进化武器，在怪物围攻中生存。</p><button id="start">开始冒险</button><button id="metaBtn" class="secondary">永久强化</button><div id="metaText"></div><small>电脑：WASD / 方向键　手机：左下摇杆</small><div>v2.0.0 · 首个可玩版本</div></section>
<section id="levelup" class="panel hidden"><h2>进化选择</h2><p>选择一项强化</p><div id="choices"></div></section><section id="result" class="panel hidden"><h2 id="resultTitle">冒险结束</h2><p id="resultText"></p><button id="again">再来一局</button><button id="home" class="secondary">返回首页</button></section><section id="metaPanel" class="panel hidden"><h2>永久强化</h2><p id="metaGold"></p><div id="metaChoices"></div><button id="metaClose" class="secondary">返回</button></section><div id="toast"></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d');let W,H,D,state='menu',last=0,elapsed=0,mult=1,p,en=[],orbs=[],shots=[],bits=[],boss=null,spawn=0,shoot=0,keys={},joy={active:false,x:0,y:0},meta={gold:0,hp:0,damage:0,speed:0},toastT;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function say(s){$('toast').textContent=s;$('toast').style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>$('toast').style.opacity=0,1800)}function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}
function load(){try{meta=Object.assign(meta,JSON.parse(localStorage.getItem('snakeMeta')||'{}'))}catch{}}
function fresh(){return{x:W/2,y:H/2,a:0,hp:100+meta.hp*15,max:100+meta.hp*15,move:185+meta.speed*8,damage:12+meta.damage*2,length:4,level:1,xp:0,next:8,gold:0,kills:0,mag:105,armor:0,poison:0,fire:0,light:0,regen:0}}
let body=[];
function start(){p=fresh();body=Array.from({length:4},(_,i)=>({x:p.x-i*17,y:p.y}));en=[];orbs=[];shots=[];bits=[];boss=null;elapsed=spawn=shoot=0;mult=1;state='play';['menu','result','metaPanel'].forEach(hide);show('hud');show('speed');if(matchMedia('(pointer:coarse)').matches)show('joystick');last=performance.now();requestAnimationFrame(loop);ui()}
function direction(){let x=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),y=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if(joy.active){x=joy.x;y=joy.y}if(x||y)p.a=Math.atan2(y,x)}
function loop(t){if(state!=='play')return;let dt=Math.min(.035,(t-last)/1000)*mult;last=t;update(dt);draw();ui();if(state==='play')requestAnimationFrame(loop)}
function update(dt){elapsed+=dt;direction();p.x=clamp(p.x+Math.cos(p.a)*p.move*dt,15,W-15);p.y=clamp(p.y+Math.sin(p.a)*p.move*dt,15,H-15);body[0].x=p.x;body[0].y=p.y;for(let i=1;i<body.length;i++){let a=body[i-1],b=body[i],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;if(d>17){b.x+=dx/d*(d-17);b.y+=dy/d*(d-17)}}
spawn-=dt;if(spawn<=0&&en.length<85){spawn=Math.max(.28,.95-elapsed/450);spawnEnemy()}
for(let e of en){let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.sp*dt;e.y+=Math.sin(a)*e.sp*dt;if(dist(e,p)<e.r+11)p.hp-=e.dmg*dt*(1-p.armor*.08);for(let i=0;i<body.length;i+=2)if(dist(e,body[i])<e.r+8)e.hp-=p.damage*.2*dt+p.poison*dt}
for(let s of shots){s.x+=Math.cos(s.a)*480*dt;s.y+=Math.sin(s.a)*480*dt;s.life-=dt;for(let e of en)if(!e.dead&&dist(e,s)<e.r+5){e.hp-=s.dmg;s.life=0;break}if(boss&&!boss.dead&&dist(boss,s)<boss.r+5){boss.hp-=s.dmg;s.life=0}}
shots=shots.filter(s=>s.life>0);for(let o of orbs){let d=dist(o,p);if(d<p.mag){let a=Math.atan2(p.y-o.y,p.x-o.x),v=440+(p.mag-d)*2.5;o.x+=Math.cos(a)*v*dt;o.y+=Math.sin(a)*v*dt}if(dist(o,p)<19){if(o.food){p.length++;body.push({...body[body.length-1]});p.hp=Math.min(p.max,p.hp+1)}else gain(o.v);o.dead=true}}orbs=orbs.filter(o=>!o.dead);
for(let e of en)if(e.hp<=0&&!e.dead){e.dead=true;p.kills++;orbs.push({x:e.x,y:e.y,food:false,v:e.elite?4:2});if(Math.random()<.2)orbs.push({x:e.x+6,y:e.y,food:true})}en=en.filter(e=>!e.dead);
shoot-=dt;if(shoot<=0){shoot=.52;let target=null,best=430;for(let e of en){let d=dist(e,p);if(d<best){best=d;target=e}}if(boss&&dist(boss,p)<best)target=boss;if(target)shots.push({x:p.x,y:p.y,a:Math.atan2(target.y-p.y,target.x-p.x),dmg:p.damage,life:1.3})}
if(p.fire>0){p.fire-=dt;if(p.fire<=0)for(let e of en)if(dist(e,p)<110)e.hp-=38}if(p.light>0){p.light-=dt;if(p.light<=0){for(let e of en)if(dist(e,p)<150)e.hp-=50;burst(p.x,p.y,'#76dfff',16)}}if(p.regen)p.hp=Math.min(p.max,p.hp+p.regen*dt);
if(!boss&&elapsed>=300)bossSpawn(false);if(!boss&&elapsed>=600)bossSpawn(true);if(boss){let a=Math.atan2(p.y-boss.y,p.x-boss.x);boss.x+=Math.cos(a)*boss.sp*dt;boss.y+=Math.sin(a)*boss.sp*dt;if(dist(boss,p)<boss.r+12)p.hp-=boss.dmg*dt;if(boss.hp<=0){if(boss.big){p.gold+=100;finish(true);return}else{p.gold+=35;gain(10);boss=null;say('小 Boss 击败！金币 +35')}}}
for(let b of bits){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}bits=bits.filter(b=>b.life>0);if(p.hp<=0)finish(false)}
function spawnEnemy(){let a=rand(0,Math.PI*2),r=Math.max(W,H)*.65,x=clamp(p.x+Math.cos(a)*r,8,W-8),y=clamp(p.y+Math.sin(a)*r,8,H-8),tank=Math.random()<.15;en.push({x,y,r:tank?15:10,hp:tank?55:24,sp:tank?38:rand(48,80)+elapsed*.02,dmg:tank?18:10,elite:Math.random()<.07})}
function bossSpawn(big){boss={x:W/2,y:-45,r:big?38:27,hp:big?2200:650,max:big?2200:650,sp:big?40:54,dmg:big?27:17,big};say(big?'最终 Boss：远古巨龙！':'小 Boss 出现！')}
function gain(v){p.xp+=v;while(p.xp>=p.next&&state==='play'){p.xp-=p.next;p.level++;p.next=Math.floor(p.next*1.28);levelUp()}}
function levelUp(){state='level';let all=[['锋利毒牙','攻击伤害 +25%',()=>p.damage*=1.25],['迅捷身法','移动速度 +15%',()=>p.move*=1.15],['钢铁鳞片','受到伤害降低 8%',()=>p.armor++],['贪婪磁场','吸附范围 +35%',()=>p.mag*=1.35],['火焰吐息','周期性灼烧附近敌人',()=>p.fire=p.fire? p.fire+1:4],['雷电环绕','周期性电击附近敌人',()=>p.light=p.light?p.light+1:5],['剧毒蛇身','蛇身接触伤害增加',()=>p.poison+=22],['生命再生','每秒恢复 1.5 生命',()=>p.regen+=1.5],['蛇身延长','增加 3 节身体并恢复生命',()=>{p.length+=3;for(let i=0;i<3;i++)body.push({...body[body.length-1]});p.hp=Math.min(p.max,p.hp+15)}]];all.sort(()=>Math.random()-.5);$('choices').innerHTML='';all.slice(0,3).forEach(o=>{let d=document.createElement('div');d.className='choice';d.innerHTML='<strong>'+o[0]+'</strong><span>'+o[1]+'</span>';d.onclick=()=>{o[2]();hide('levelup');state='play';last=performance.now();requestAnimationFrame(loop)};$('choices').append(d)});show('levelup')}
function burst(x,y,color,n){for(let i=0;i<n;i++){let a=rand(0,7),v=rand(20,130);bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.2,.6),color})}}
function draw(){ctx.fillStyle='#090d16';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#172236';for(let x=0;x<W;x+=42){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let o of orbs){ctx.fillStyle=o.food?'#ffc65c':'#64aaff';ctx.beginPath();ctx.arc(o.x,o.y,o.food?6:5,0,7);ctx.fill()}for(let e of en){ctx.fillStyle=e.elite?'#c276ff':'#e65e78';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill()}for(let s of shots){ctx.fillStyle='#ffe18a';ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.fill()}for(let i=body.length-1;i>=0;i--){let b=body[i];ctx.fillStyle=i===0?'#75e0bd':i%2?'#3fae9b':'#328d91';ctx.beginPath();ctx.arc(b.x,b.y,i===0?13:9,0,7);ctx.fill()}ctx.fillStyle='#07121a';ctx.beginPath();ctx.arc(p.x+Math.cos(p.a)*5,p.y+Math.sin(p.a)*5,3,0,7);ctx.fill();if(boss){ctx.fillStyle=boss.big?'#ff714e':'#b77cff';ctx.beginPath();ctx.arc(boss.x,boss.y,boss.r,0,7);ctx.fill();ctx.fillStyle='#27334a';ctx.fillRect(W/2-100,62,200,7);ctx.fillStyle='#ed6682';ctx.fillRect(W/2-100,62,200*boss.hp/boss.max,7)}for(let b of bits){ctx.globalAlpha=clamp(b.life*2,0,1);ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,3,3)}ctx.globalAlpha=1}
function ui(){if(!p)return;$('hp').textContent=Math.ceil(p.hp)+'/'+p.max;$('level').textContent=p.level;$('length').textContent=body.length;$('time').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('gold').textContent=p.gold;$('hpbar').style.width=clamp(p.hp/p.max*100,0,100)+'%';$('xpbar').style.width=clamp(p.xp/p.next*100,0,100)+'%';$('build').textContent='毒牙 Lv.'+Math.floor(p.damage/12)+' · 火焰 '+(p.fire||0)+' · 闪电 '+(p.light||0)}
function finish(win){if(state==='result')return;state='result';meta.gold+=p.gold+Math.floor(elapsed/20);localStorage.setItem('snakeMeta',JSON.stringify(meta));hide('hud');hide('speed');hide('joystick');hide('levelup');$('resultTitle').textContent=win?'胜利！':'冒险结束';$('resultText').textContent='生存 '+Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0')+' · 击败 '+p.kills+' 个敌人 · 获得 '+p.gold+' 金币';show('result')}
function metaUI(){load();$('metaText').textContent='永久金币：'+meta.gold;$('metaGold').textContent='可用金币：'+meta.gold;$('metaChoices').innerHTML='';[['生命 +15','hp'],['伤害 +2','damage'],['速度 +8','speed']].forEach(([t,k])=>{let b=document.createElement('button');b.className='secondary';b.textContent=t+'（20 金币）';b.onclick=()=>{if(meta.gold<20)return say('金币不足');meta.gold-=20;meta[k]=(meta[k]||0)+1;localStorage.setItem('snakeMeta',JSON.stringify(meta));metaUI()};$('metaChoices').append(b)})}
$('start').onclick=start;$('again').onclick=start;$('home').onclick=()=>{hide('result');show('menu');metaUI()};$('metaBtn').onclick=()=>{metaUI();hide('menu');show('metaPanel')};$('metaClose').onclick=()=>{hide('metaPanel');show('menu')};$('speed').onclick=()=>{mult=mult===1?2:1;$('speed').textContent='速度 ×'+mult};
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);let je=$('joystick'),st=$('stick');function jm(e){let r=je.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y),m=43;if(d>m){x=x/d*m;y=y/d*m}joy.x=x/m;joy.y=y/m;st.style.transform='translate('+x+'px,'+y+'px)'}je.addEventListener('pointerdown',e=>{joy.active=true;je.setPointerCapture(e.pointerId);jm(e)});je.addEventListener('pointermove',e=>{if(joy.active)jm(e)});function endJoy(){joy.active=false;joy.x=joy.y=0;st.style.transform='translate(0,0)'}je.addEventListener('pointerup',endJoy);je.addEventListener('pointercancel',endJoy);load();metaUI();
})();
</script></body></html>
