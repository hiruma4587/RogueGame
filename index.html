<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d16"><title>蛇之争霸 · Snake Survivors</title><style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#090d16;color:#eef3ff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.hidden{display:none!important}.panel{position:fixed;z-index:50;inset:0;margin:auto;width:min(92vw,480px);height:max-content;max-height:90vh;overflow:auto;background:#111a2af2;border:1px solid #34435d;border-radius:20px;padding:25px;text-align:center;z-index:20;box-shadow:0 20px 70px #000b}.panel h1{font-size:42px;margin:5px}.panel p{color:#aebbd0}.panel button{display:block;position:relative;z-index:30;width:100%;border:0;border-radius:11px;padding:13px;margin:10px 0;background:#5e83ed;color:white;font-size:16px;pointer-events:auto;touch-action:manipulation;cursor:pointer}.secondary{background:#29354a!important}.choice{background:#1b2940;border:1px solid #3a4d6d;border-radius:12px;padding:14px;margin:9px 0;text-align:left}.choice strong,.choice span{display:block}.choice span{font-size:13px;color:#aab8ce;margin-top:4px}#hud{position:absolute;z-index:4;left:12px;top:10px;right:90px;pointer-events:none;text-shadow:0 1px 3px #000}.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.bar{height:7px;max-width:360px;background:#293348;border-radius:8px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#f05d78}.xp i{background:#5ba7ff!important}#build{font-size:11px;color:#aab8ce;margin-top:6px}#speed{position:absolute;z-index:6;right:12px;top:12px;padding:10px 13px;background:#172337;color:white;border:1px solid #45536a;border-radius:11px}#joystick{position:absolute;z-index:8;left:24px;bottom:32px;width:128px;height:128px;border:2px solid #ffffff35;background:#ffffff0b;border-radius:50%;touch-action:none}#stick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#a9c8ff55;border:2px solid #d5e4ff88;pointer-events:none}#toast{position:absolute;z-index:12;left:50%;top:22%;transform:translateX(-50%);background:#111b2ddd;border:1px solid #465875;padding:9px 15px;border-radius:20px;opacity:0;pointer-events:none;font-size:13px}@media(min-width:700px){#joystick{display:none!important}#hud{left:20px;top:18px}.stats{font-size:15px}}
</style></head><body><main id="app"><canvas id="game"></canvas>
<header id="hud" class="hidden"><div class="stats"><span>等级 <b id="level">1</b></span><span>长度 <b id="length">4</b></span><span>时间 <b id="time">0:00</b></span><span>金币 <b id="gold">0</b></span></div><div class="bar xp"><i id="xpbar"></i></div><div id="build"></div></header><button id="speed" class="hidden">速度 ×1</button><div id="joystick" class="hidden"><div id="stick"></div></div>
<section id="menu" class="panel"><div style="color:#76d7c4;letter-spacing:4px;font-size:12px">SNAKE SURVIVORS</div><h1>蛇之争霸</h1><p>吞噬能量、成长变长，与其他蛇争夺生存空间。蛇头碰撞即淘汰。</p><button id="start">开始冒险</button><button id="metaBtn" class="secondary">永久强化</button><div id="metaText"></div><small>电脑：WASD / 方向键　手机：左下摇杆</small><div>v2.5.1 · 修复移动端按钮点击响应</div></section>
<section id="levelup" class="panel hidden"><h2>进化选择</h2><p>选择一项强化</p><div id="choices"></div></section><section id="result" class="panel hidden"><h2 id="resultTitle">冒险结束</h2><p id="resultText"></p><button id="again">再来一局</button><button id="home" class="secondary">返回首页</button></section><section id="metaPanel" class="panel hidden"><h2>永久强化</h2><p id="metaGold"></p><div id="metaChoices"></div><button id="metaClose" class="secondary">返回</button></section><div id="toast"></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d');const WORLD_W=4200,WORLD_H=3000;let W,H,D,state='menu',last=0,elapsed=0,mult=1,p,bots=[],orbs=[],bits=[],spawn=0,orbSpawn=0,keys={},joy={active:false,x:0,y:0},meta={gold:0,damage:0,speed:0},toastT;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function say(s){$('toast').textContent=s;$('toast').style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>$('toast').style.opacity=0,1800)}function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}
function load(){try{meta=Object.assign(meta,JSON.parse(localStorage.getItem('snakeMeta')||'{}'))}catch{}}
function fresh(){return{x:WORLD_W/2,y:WORLD_H/2,a:0,move:185+meta.speed*8,length:4,level:1,xp:0,next:8,gold:0,kills:0,mag:105,foodRate:1,trail:[]}}
let body=[];
function start(){p=fresh();body=Array.from({length:4+(meta.damage||0)*2},(_,i)=>({x:p.x-i*17,y:p.y}));p.trail=Array.from({length:Math.max(180,body.length*10)},(_,i)=>({x:p.x-i*2,y:p.y}));bots=[];orbs=[];bits=[];elapsed=0;spawn=1.5;orbSpawn=1.2;for(let i=0;i<8;i++){let a=rand(0,Math.PI*2),d=rand(180,650);orbs.push({x:clamp(p.x+Math.cos(a)*d,50,WORLD_W-50),y:clamp(p.y+Math.sin(a)*d,50,WORLD_H-50),food:false,v:2})}for(let i=0;i<14;i++)spawnSnake();mult=1;state='play';['menu','result','metaPanel'].forEach(hide);show('hud');show('speed');if(matchMedia('(pointer:coarse)').matches)show('joystick');last=performance.now();requestAnimationFrame(loop);ui()}
function direction(dt){let x=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),y=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if(joy.active){x=joy.x;y=joy.y}if(x||y){let target=Math.atan2(y,x);p.a=turnTowards(p.a,target,4.2*dt)}}
function turnTowards(current,target,maxStep){let d=Math.atan2(Math.sin(target-current),Math.cos(target-current));return current+clamp(d,-maxStep,maxStep)}
function loop(t){if(state!=='play')return;let dt=Math.min(.035,(t-last)/1000)*mult;last=t;update(dt);draw();ui();if(state==='play')requestAnimationFrame(loop)}
function update(dt){elapsed+=dt;direction(dt);p.x=clamp(p.x+Math.cos(p.a)*p.move*dt,18,WORLD_W-18);p.y=clamp(p.y+Math.sin(p.a)*p.move*dt,18,WORLD_H-18);updateTrail(p.trail,p.x,p.y,body,17);
orbSpawn-=dt;if(orbSpawn<=0&&orbs.length<28){let a=rand(0,Math.PI*2),r=rand(260,520);orbs.push({x:clamp(p.x+Math.cos(a)*r,40,WORLD_W-40),y:clamp(p.y+Math.sin(a)*r,40,WORLD_H-40),food:false,v:2});orbSpawn=rand(1.2,2.1)}spawn-=dt;if(spawn<=0&&bots.length<36){spawn=rand(1.8,2.8);spawnSnake()}
for(const o of orbs){let d=dist(o,p);if(d<p.mag){let a=Math.atan2(p.y-o.y,p.x-o.x),v=440+(p.mag-d)*2.5;o.x+=Math.cos(a)*v*dt;o.y+=Math.sin(a)*v*dt}if(dist(o,p)<19){if(o.food){body.push({...body[body.length-1]});p.gold+=1}else gain(o.v);o.dead=true}}orbs=orbs.filter(o=>!o.dead);
updateBots(dt);for(const b of bots){if(b.body.some(q=>dist(q,p)<12)){finish(false);return}}
for(const q of bits){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt}bits=bits.filter(q=>q.life>0);
if(p.x<=18||p.x>=WORLD_W-18||p.y<=18||p.y>=WORLD_H-18||body.slice(5).some(q=>dist(q,p)<12)){finish(false);return}
}
function snakeRadius(n,head=false){return (head?12:7)+Math.min(5,Math.max(0,(n-6)/10))}function spawnSnake(){let a=rand(0,Math.PI*2),r=rand(260,1100),x=clamp(p.x+Math.cos(a)*r,100,WORLD_W-100),y=clamp(p.y+Math.sin(a)*r,100,WORLD_H-100),n=Math.floor(rand(4,31)),seg=[{x,y}],trail=Array.from({length:Math.max(220,n*12)},(_,i)=>({x:x-Math.cos(a)*i*2,y:y-Math.sin(a)*i*2}));bots.push({x,y,a,trail,move:rand(115,155)+elapsed*.01,body:seg,targetLength:n,growTimer:0,think:0,color:['#e76d83','#b27bfa','#e9b85e','#65a7ed','#ee8c56'][Math.floor(Math.random()*5)]})}
function updateTrail(trail,x,y,segments,spacing){segments[0].x=x;segments[0].y=y;trail.unshift({x,y});let walked=0,idx=0;for(let i=1;i<segments.length;i++){let target=i*spacing;while(idx<trail.length-1){let d=dist(trail[idx],trail[idx+1]);if(walked+d>=target){let t=(target-walked)/(d||1);segments[i].x=trail[idx].x+(trail[idx+1].x-trail[idx].x)*t;segments[i].y=trail[idx].y+(trail[idx+1].y-trail[idx].y)*t;break}walked+=d;idx++}}let keep=segments.length*spacing+120;while(trail.length>2&&trail.length>keep/2)trail.pop()}
function dropSnakeOrbs(b){let count=Math.max(2,Math.ceil(b.body.length/2));for(let i=0;i<b.body.length;i+=Math.max(1,Math.floor(b.body.length/count))){let q=b.body[i];orbs.push({x:q.x+rand(-9,9),y:q.y+rand(-9,9),food:false,v:1})}if(b.body.length){let q=b.body[0];orbs.push({x:q.x,y:q.y,food:false,v:2})}}
function updateBots(dt){for(const b of bots){b.growTimer-=dt;if(b.body.length<b.targetLength&&b.growTimer<=0){let tail=b.body[b.body.length-1];b.body.push({x:tail.x-Math.cos(b.a)*16,y:tail.y-Math.sin(b.a)*16});b.growTimer=.09}b.think-=dt;if(b.think<=0){b.think=rand(.25,.55);let target=orbs.reduce((best,o)=>!best||dist(o,b)<dist(best,b)?o:best,null);if(target)b.targetA=Math.atan2(target.y-b.y,target.x-b.x)+rand(-.12,.12);else b.targetA=b.a+rand(-.8,.8)}if(b.targetA!==undefined)b.a=turnTowards(b.a,b.targetA,3.2*dt);b.x=clamp(b.x+Math.cos(b.a)*b.move*dt,18,WORLD_W-18);b.y=clamp(b.y+Math.sin(b.a)*b.move*dt,18,WORLD_H-18);updateTrail(b.trail,b.x,b.y,b.body,16);if(b.x<=18||b.x>=WORLD_W-18||b.y<=18||b.y>=WORLD_H-18||b.body.slice(4).some(q=>dist(q,b)<10)){dropSnakeOrbs(b);b.dead=true;continue}if(body.some(q=>dist(q,b)<12)){p.kills++;p.gold+=5;dropSnakeOrbs(b);b.dead=true;say('成功淘汰对手蛇！');continue}for(const other of bots){if(other!==b&&!other.dead&&other.body.some(q=>dist(q,b)<11)){b.dead=true;dropSnakeOrbs(b);break}}}bots=bots.filter(b=>!b.dead)}
function gain(v){p.xp+=v*p.foodRate;while(p.xp>=p.next&&state==='play'){p.xp-=p.next;p.level++;p.next=Math.floor(p.next*1.28);levelUp()}}
function levelUp(){state='level';let all=[['急速转向','转向响应与操控灵活度提升',()=>p.move*=1.04],['迅捷身法','移动速度 +12%',()=>p.move*=1.12],['贪婪磁场','食物吸附范围 +35%',()=>p.mag*=1.35],['成长本能','立即增长 3 节身体',()=>{for(let i=0;i<3;i++)body.push({...body[body.length-1]})}],['能量丰收','经验获取 +25%',()=>p.foodRate*=1.25],['长蛇形态','增长 5 节身体，移动速度 +5%',()=>{for(let i=0;i<5;i++)body.push({...body[body.length-1]});p.move*=1.05}],['灵巧蛇身','身体更紧凑，移动速度 +8%',()=>p.move*=1.08],['经验储备','立即获得 5 点经验',()=>gain(5)],['捕食者本能','获得 20 枚金币',()=>p.gold+=20]];all.sort(()=>Math.random()-.5);$('choices').innerHTML='';all.slice(0,3).forEach(o=>{let d=document.createElement('div');d.className='choice';d.innerHTML='<strong>'+o[0]+'</strong><span>'+o[1]+'</span>';d.onclick=()=>{o[2]();hide('levelup');state='play';last=performance.now();requestAnimationFrame(loop)};$('choices').append(d)});show('levelup')}
function burst(x,y,color,n){for(let i=0;i<n;i++){let a=rand(0,7),v=rand(20,130);bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.2,.6),color})}}
function drawHead(x,y,a,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r+2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eaffff';ctx.beginPath();ctx.arc(x+Math.cos(a)*r*.48-Math.sin(a)*r*.38,y+Math.sin(a)*r*.48+Math.cos(a)*r*.38,Math.max(2.5,r*.23),0,Math.PI*2);ctx.arc(x+Math.cos(a)*r*.48+Math.sin(a)*r*.38,y+Math.sin(a)*r*.48-Math.cos(a)*r*.38,Math.max(2.5,r*.23),0,Math.PI*2);ctx.fill();ctx.fillStyle='#10202a';ctx.beginPath();ctx.arc(x+Math.cos(a)*r*.58-Math.sin(a)*r*.38,y+Math.sin(a)*r*.58+Math.cos(a)*r*.38,Math.max(1.2,r*.1),0,Math.PI*2);ctx.arc(x+Math.cos(a)*r*.58+Math.sin(a)*r*.38,y+Math.sin(a)*r*.58-Math.cos(a)*r*.38,Math.max(1.2,r*.1),0,Math.PI*2);ctx.fill()}
function draw(){ctx.fillStyle='#090d16';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-p.x,H/2-p.y);ctx.fillStyle='#0c1422';ctx.fillRect(0,0,WORLD_W,WORLD_H);ctx.strokeStyle='#1a2940';ctx.lineWidth=2;for(let x=0;x<=WORLD_W;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD_H);ctx.stroke()}for(let y=0;y<=WORLD_H;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD_W,y);ctx.stroke()}ctx.strokeStyle='#7184a8';ctx.lineWidth=8;ctx.strokeRect(0,0,WORLD_W,WORLD_H);for(let o of orbs){ctx.fillStyle=o.food?'#ffc65c':'#64aaff';ctx.beginPath();ctx.arc(o.x,o.y,o.food?6:5,0,7);ctx.fill()}for(let b of bots){for(let i=b.body.length-1;i>=1;i--){let q=b.body[i];ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(q.x,q.y,snakeRadius(b.body.length,false),0,Math.PI*2);ctx.fill()}drawHead(b.x,b.y,b.a,snakeRadius(b.body.length,true),b.color)}for(let i=body.length-1;i>=1;i--){let b=body[i];ctx.fillStyle=i%2?'#3fae9b':'#328d91';ctx.beginPath();ctx.arc(b.x,b.y,snakeRadius(body.length,false)+2,0,Math.PI*2);ctx.fill()}drawHead(p.x,p.y,p.a,13,'#75e0bd');for(let q of bits){ctx.globalAlpha=clamp(q.life*2,0,1);ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,3,3)}ctx.globalAlpha=1;ctx.restore()}
function ui(){if(!p)return;$('level').textContent=p.level;$('length').textContent=body.length;$('time').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('gold').textContent=p.gold;$('xpbar').style.width=clamp(p.xp/p.next*100,0,100)+'%';$('build').textContent='对手 '+bots.length+' 条 · 经验 '+p.xp+'/'+p.next}
function finish(){if(state==='result')return;for(let i=0;i<body.length;i+=2){let q=body[i];orbs.push({x:q.x,y:q.y,food:false,v:1})}orbs.push({x:p.x,y:p.y,food:false,v:2});state='result';meta.gold+=p.gold+Math.floor(elapsed/20);localStorage.setItem('snakeMeta',JSON.stringify(meta));hide('hud');hide('speed');hide('joystick');hide('levelup');$('resultTitle').textContent='蛇头被碰撞，游戏结束';$('resultText').textContent='生存 '+Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0')+' · 淘汰 '+p.kills+' 条对手蛇 · 获得 '+p.gold+' 金币';show('result')}
function metaUI(){load();$('metaText').textContent='永久金币：'+meta.gold;$('metaGold').textContent='可用金币：'+meta.gold;$('metaChoices').innerHTML='';[['初始长度 +2','length'],['移动速度 +8','speed'],['食物吸附 +15','mag']].forEach(([t,k])=>{let b=document.createElement('button');b.className='secondary';b.textContent=t+'（20 金币）';b.onclick=()=>{if(meta.gold<20)return say('金币不足');meta.gold-=20;if(k==='length')meta.damage=(meta.damage||0)+1;else if(k==='speed')meta.speed=(meta.speed||0)+1;else meta.hp=(meta.hp||0)+1;localStorage.setItem('snakeMeta',JSON.stringify(meta));metaUI()};$('metaChoices').append(b)})}
$('start').onclick=start;$('again').onclick=start;$('home').onclick=()=>{hide('result');show('menu');metaUI()};$('metaBtn').onclick=()=>{metaUI();hide('menu');show('metaPanel')};$('metaClose').onclick=()=>{hide('metaPanel');show('menu')};$('speed').onclick=()=>{mult=mult===1?2:1;$('speed').textContent='速度 ×'+mult};
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);let je=$('joystick'),st=$('stick');function jm(e){let r=je.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y),m=43;if(d>m){x=x/d*m;y=y/d*m}joy.x=x/m;joy.y=y/m;st.style.transform='translate('+x+'px,'+y+'px)'}je.addEventListener('pointerdown',e=>{joy.active=true;je.setPointerCapture(e.pointerId);jm(e)});je.addEventListener('pointermove',e=>{if(joy.active)jm(e)});function endJoy(){joy.active=false;joy.x=joy.y=0;st.style.transform='translate(0,0)'}je.addEventListener('pointerup',endJoy);je.addEventListener('pointercancel',endJoy);load();metaUI();
})();
</script></body></html>
